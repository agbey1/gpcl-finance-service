version: '3.8'

services:
  finance-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=prod-finance-jwt-secret-key-32-chars-minimum-2026!
      - SQLSERVER_HOST=sqlserver
      - SQLSERVER_DATABASE=gpcl_finance_db
      - SQLSERVER_USER=sa
      - SQLSERVER_PASSWORD=ProdSqlPassword2026!
      - SQLSERVER_ENCRYPT=false
      - SQLSERVER_TRUST=true
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=ProdSqlPassword2026!
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ProdSqlPassword2026!' -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
